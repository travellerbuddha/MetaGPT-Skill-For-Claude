# MetaGPT -> Claude config. setup.sh renders this to ~/.metagpt/config2.yaml,
# replacing __ANTHROPIC_API_KEY__ with $ANTHROPIC_API_KEY. Never commit a real key.
llm:
  api_type: "anthropic"
  base_url: "https://api.anthropic.com"   # required: default is the OpenAI URL
  api_key: "__ANTHROPIC_API_KEY__"
  model: "__METAGPT_CLAUDE_MODEL__"
  max_token: 16000        # thinking tokens count toward this; keep <21k for non-streaming calls
  stream: true
  timeout: 600

repair_llm_output: true
